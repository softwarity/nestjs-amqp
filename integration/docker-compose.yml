services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: nestjs-amqp-integ-rabbit
    ports:
      # Non-default host ports to avoid colliding with a local RabbitMQ.
      # Inside the container the broker still listens on 5672 / 15672.
      - "5674:5672"
      - "15674:15672"
    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  artemis:
    image: apache/activemq-artemis:latest-alpine
    container_name: nestjs-amqp-integ-artemis
    ports:
      - "5675:5672"   # AMQP
      - "8161:8161"   # web console (handy for debug)
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      # Accept anonymous SASL so the lib's auth-less connect works.
      ANONYMOUS_LOGIN: "true"
    # NOTE: we do NOT mount a custom broker.xml — the Apache image's entrypoint
    # runs `artemis create` on first boot to generate /var/lib/artemis-instance,
    # and mounting broker.xml under etc/ would short-circuit that init (exit
    # 127). We rely on the default broker.xml (auto-create-queues = true) which
    # covers all but the topology-heavy scenarios (multicast broadcast and
    # DLX-routed DLQ) — those are .skip'd on Artemis with a comment.
    healthcheck:
      # wget is part of busybox on the alpine image; curl may not be.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8161/console/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  qpid:
    image: apache/qpid-broker-j:latest-alpine
    container_name: nestjs-amqp-integ-qpid
    # The Apache image publishes linux/amd64 only; pinning the platform keeps
    # the warning (and the surprise) out of arm64 dev machines — it runs
    # emulated there, natively on CI.
    platform: linux/amd64
    ports:
      - "5676:5672"   # AMQP
      - "8163:8080"   # HTTP management (handy for debug)
    environment:
      QPID_ADMIN_USER: admin
      QPID_ADMIN_PASSWORD: admin
    volumes:
      # The image's entrypoint seeds its instance from work-init/, then lets
      # work-override/ win. Dropping our config.json there replaces the
      # default one on first boot — no need to fight the instance creation
      # the way Artemis forces us to.
      - ./qpid/config.json:/qpid-broker-j/work-override/config.json:ro
      # The node store already exists in work-init/, so the broker ignores
      # `virtualHostInitialConfiguration`: the queues have to be declared in
      # the store itself. Qpid Broker-J creates nothing on its own.
      - ./qpid/default.json:/qpid-broker-j/work-override/default.json:ro
    healthcheck:
      # Basic auth is enabled on the management port, so the probe carries
      # credentials; a bare GET would answer 401 and read as unhealthy. The
      # image's wget is busybox, which has no --user/--password — hence the
      # pre-encoded header (admin:admin).
      test: ["CMD-SHELL", "wget -q --header='Authorization: Basic YWRtaW46YWRtaW4=' -O- http://localhost:8080/api/latest/broker >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
