name: Create Tag/Release
run-name: ${{ github.actor }} release ${{ inputs.bump }} on ${{ github.repository }}
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
jobs:
  create-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT (not GITHUB_TOKEN) so the pushed tag triggers tag.yml (npm publish).
          token: ${{ secrets.PAT_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Everything below runs BEFORE release-flow: the tag is what triggers the
      # npm publish, so nothing gets tagged that tag.yml would then refuse.
      - name: Verify NPM token is valid
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm whoami --registry https://registry.npmjs.org/
      - name: Lint, test and build before tagging
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      # Bumps package.json, renames "## NEXT RELEASE" in RELEASE_NOTES.md to the
      # new version, tags v<version>, publishes the GitHub Release from those
      # notes and reopens an empty "## NEXT RELEASE".
      - name: Release
        uses: softwarity/release-flow@v1
        with:
          bump: ${{ inputs.bump }}
